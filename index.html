<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atharv's Unblocked HTML5 Games</title>
<style>
 @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap');

 :root {
 --bg: #0a0a0f;
 --surface: #111118;
 --card: #16161f;
 --border: #2a2a3a;
 --accent: #e8ff47;
 --accent2: #ff4f7b;
 --text: #f0f0f5;
 --muted: #6b6b80;
 --glow: rgba(232,255,71,0.15);
 }

 * { margin: 0; padding: 0; box-sizing: border-box; }

 body {
 background: var(--bg);
 color: var(--text);
 font-family: 'DM Sans', sans-serif;
 min-height: 100vh;
 overflow-x: hidden;
 }

 /* Noise overlay */
 body::before {
 content: '';
 position: fixed;
 inset: 0;
 background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
 pointer-events: none;
 z-index: 1000;
 opacity: 0.4;
 }

 header {
 padding: 48px 40px 32px;
 position: relative;
 border-bottom: 1px solid var(--border);
 }

 .header-inner {
 max-width: 1400px;
 margin: 0 auto;
 display: flex;
 align-items: flex-end;
 justify-content: space-between;
 gap: 24px;
 flex-wrap: wrap;
 }

 .logo {
 font-family: 'Bebas Neue', sans-serif;
 font-size: clamp(56px, 8vw, 100px);
 line-height: 0.9;
 letter-spacing: 2px;
 color: var(--accent);
 text-shadow: 0 0 60px rgba(232,255,71,0.3);
 }

 .logo span {
 color: var(--text);
 opacity: 0.15;
 }

 .tagline {
 color: var(--muted);
 font-size: 14px;
 letter-spacing: 0.1em;
 text-transform: uppercase;
 margin-top: 8px;
 }

 .stats {
 display: flex;
 gap: 32px;
 padding-bottom: 4px;
 }

 .stat {
 text-align: right;
 }

 .stat-num {
 font-family: 'Bebas Neue', sans-serif;
 font-size: 36px;
 color: var(--accent);
 line-height: 1;
 }

 .stat-label {
 font-size: 11px;
 color: var(--muted);
 text-transform: uppercase;
 letter-spacing: 0.08em;
 }

 .controls {
 padding: 24px 40px;
 max-width: 1400px;
 margin: 0 auto;
 display: flex;
 gap: 16px;
 align-items: center;
 flex-wrap: wrap;
 }

 .search-wrap {
 position: relative;
 flex: 1;
 min-width: 240px;
 }

 .search-wrap svg {
 position: absolute;
 left: 14px;
 top: 50%;
 transform: translateY(-50%);
 color: var(--muted);
 pointer-events: none;
 }

 input[type="search"] {
 width: 100%;
 background: var(--surface);
 border: 1px solid var(--border);
 border-radius: 8px;
 padding: 10px 14px 10px 40px;
 color: var(--text);
 font-family: 'DM Sans', sans-serif;
 font-size: 14px;
 outline: none;
 transition: border-color 0.2s;
 }

 input[type="search"]:focus {
 border-color: var(--accent);
 box-shadow: 0 0 0 3px var(--glow);
 }

 input[type="search"]::placeholder { color: var(--muted); }

 .filter-btns {
 display: flex;
 gap: 8px;
 flex-wrap: wrap;
 }

 .filter-btn {
 background: var(--surface);
 border: 1px solid var(--border);
 color: var(--muted);
 border-radius: 6px;
 padding: 8px 16px;
 font-family: 'DM Sans', sans-serif;
 font-size: 13px;
 cursor: pointer;
 transition: all 0.15s;
 white-space: nowrap;
 }

 .filter-btn:hover, .filter-btn.active {
 background: var(--accent);
 border-color: var(--accent);
 color: #000;
 font-weight: 600;
 }

 .grid {
 max-width: 1400px;
 margin: 0 auto;
 padding: 8px 40px 60px;
 display: grid;
 grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
 gap: 12px;
 }

 .game-card {
 background: var(--card);
 border: 1px solid var(--border);
 border-radius: 10px;
 overflow: hidden;
 cursor: pointer;
 transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
 position: relative;
 group: true;
 }

 .game-card:hover {
 transform: translateY(-3px);
 border-color: var(--accent);
 box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 0 1px var(--accent);
 }

 .game-card:active {
 transform: translateY(0);
 }

 .card-icon {
 height: 90px;
 background: linear-gradient(135deg, #1a1a28 0%, #0d0d1a 100%);
 display: flex;
 align-items: center;
 justify-content: center;
 font-size: 36px;
 border-bottom: 1px solid var(--border);
 position: relative;
 overflow: hidden;
 }

 .card-icon::after {
 content: '';
 position: absolute;
 inset: 0;
 background: radial-gradient(circle at 50% 120%, var(--glow) 0%, transparent 60%);
 }

 .card-body {
 padding: 10px 12px 12px;
 }

 .card-name {
 font-size: 13px;
 font-weight: 600;
 color: var(--text);
 line-height: 1.3;
 display: -webkit-box;
 -webkit-line-clamp: 2;
 -webkit-box-orient: vertical;
 overflow: hidden;
 }

 .card-play {
 margin-top: 8px;
 display: flex;
 align-items: center;
 gap: 5px;
 font-size: 11px;
 color: var(--accent);
 font-weight: 600;
 text-transform: uppercase;
 letter-spacing: 0.06em;
 opacity: 0;
 transform: translateY(4px);
 transition: all 0.15s;
 }

 .game-card:hover .card-play {
 opacity: 1;
 transform: translateY(0);
 }

 .no-results {
 grid-column: 1/-1;
 text-align: center;
 color: var(--muted);
 padding: 60px 0;
 font-size: 16px;
 }

 .no-results span {
 font-family: 'Bebas Neue', sans-serif;
 font-size: 48px;
 color: var(--border);
 display: block;
 margin-bottom: 8px;
 }

 /* Cloak info banner */
 .cloak-banner {
 max-width: 1400px;
 margin: 0 auto;
 padding: 0 40px;
 }

 .cloak-info {
 background: rgba(232,255,71,0.06);
 border: 1px solid rgba(232,255,71,0.2);
 border-radius: 8px;
 padding: 10px 16px;
 font-size: 13px;
 color: var(--muted);
 display: flex;
 align-items: center;
 gap: 8px;
 }

 .cloak-info strong { color: var(--accent); }

 @media (max-width: 600px) {
 header { padding: 32px 20px 24px; }
 .controls, .grid, .cloak-banner { padding-left: 20px; padding-right: 20px; }
 .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
 }
</style>

const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');
const filterBtns = document.querySelectorAll('.filter-btn');
let activeFilter = 'all';

document.getElementById('total-count').textContent = games.length;

function formatName(folder) {
 return folder
 .replace(/[-_]/g, ' ')
 .replace(/\b\w/g, c => c.toUpperCase());
}

function launchGame(folder, name) {
 const gameUrl = BASE + encodeURIComponent(folder) + '/index.html';
 const tab = window.open('about:blank', '_blank');
 if (!tab) { alert('Please allow popups for this site!'); return; }
 tab.document.open();
 tab.document.write(`<!DOCTYPE html>
<html>
<head>
<title>${name}</title>
<style>
 * { margin:0; padding:0; box-sizing:border-box; }
 html, body { width:100%; height:100%; overflow:hidden; background:#000; }
 iframe { width:100%; height:100%; border:none; display:block; }
</style>
</head>
<body>
<iframe src="${gameUrl}" allowfullscreen allow="autoplay; fullscreen; gamepad"></iframe>
</body>
</html>`);
 tab.document.close();
}

function renderGames() {
 const q = searchInput.value.toLowerCase().trim();
 const filtered = games.filter(g => {
 const matchesSearch = !q || g.name.toLowerCase().includes(q) || g.folder.toLowerCase().includes(q);
 const matchesFilter = activeFilter === 'all' || g.tags.includes(activeFilter);
 return matchesSearch && matchesFilter;
 });

 grid.innerHTML = '';

 if (filtered.length === 0) {
 grid.innerHTML = '<div class="no-results"><span>404</span>No games found</div>';
 return;
 }

 filtered.forEach(g => {
 const card = document.createElement('div');
 card.className = 'game-card';
 card.innerHTML = `
 <div class="card-icon">${g.icon}</div>
 <div class="card-body">
 <div class="card-name">${g.name}</div>
 <div class="card-play">▶ Play Now</div>
 </div>
 `;
 card.addEventListener('click', () => launchGame(g.folder, g.name));
 grid.appendChild(card);
 });
}

searchInput.addEventListener('input', renderGames);

filterBtns.forEach(btn => {
 btn.addEventListener('click', () => {
 filterBtns.forEach(b => b.classList.remove('active'));
 btn.classList.add('active');
 activeFilter = btn.dataset.filter;
 renderGames();
 });
});

renderGames();
